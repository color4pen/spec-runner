name: SpecRunner Dispatch

# Actions 画面から issue 番号だけで pipeline を起動 / 再開 / 取り込みする手動発火。
# issue 本文の取得・slug 抽出・draft 実体化・branch 特定はすべて CLI の issue-target 層が担い、
# workflow は SpecRunner の内部知識を持たない。
#
# - start:  issue 本文（request.md 形式、Meta に slug 必須）から新規 job を起動する。
#           feature branch は issue の Development linked branch として登録される。
# - resume: escalation で awaiting-resume になった job を issue 番号から再開する。
#           issue コメントの escalation marker → Development リンク → checkpoint identity 照合
#           → rebind → resume。checkpoint は feature branch に publish されているため、
#           別 runner（ephemeral 環境）からでも issue 番号だけで継続できる。
#           canon（design.md 等）の operator 修正が必要な場合は、operator が feature branch へ
#           operator-apply commit を直接 push してから resume する（CANON_FINDING_ESCALATION の
#           復帰手順）。patch を workflow input で輸送しない — inline 輸送は env / 転記で壊れる
#           (実測: run 32554216686 / run 32590206028) うえ、canon 変更は git commit として
#           レビュー可能な形で入るのが正道。
#           wontfix / wontfix_reason は regression-gate findings への operator 不採用裁定
#           （--wontfix / --wontfix-reason）をそのまま透過する。
# - reopen: PR 作成後に awaiting-archive で待機する job を pipeline に戻す（#1066）。
#           Development linked branch（無ければ closing PR 参照）を解決して attach →
#           job reopen <slug> --from <step> --reason <text>。reopen transition 自体は
#           commit を作らない。canon の operator 修正が必要な場合は、operator が feature
#           branch へ operator-apply commit を直接 push してから reopen する（dirty のまま
#           置くと step 境界の write-scope 検査に誤帰属される — 実測: run 32569597460）。
#           PR が OPEN であること・status が awaiting-archive であることは CLI の reopen
#           gate が検証する。reopen は --apply-canon / --prompt を受けない（CLI 契約）ため
#           prompt は透過しない。
# - archive: 完走した job を issue 番号から取り込む。2 相の実行を前提とする。
#            1 回目（merge 前）: completed marker → archive record を feature branch に push し
#            awaiting-archive を維持する。
#            2 回目（merge 後・head branch 削除済み）: checkout 済み base の archive record から
#            slug を解決し completeAfterMerge を実行して exit 0 で終わる。
#            相の判定と完了処理はすべて CLI 側（runPlainArchive）にあり、workflow は状態を見ない。
#
# 前提: リポジトリ secret CLAUDE_CODE_OAUTH_TOKEN（`claude setup-token` の出力）。

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
      action:
        description: "start: issue 本文から新規 job を起動 / resume: escalation 済み job を再開 / reopen: awaiting-archive job を pipeline に戻す / archive: 完走した job を取り込む"
        type: choice
        options:
          - start
          - resume
          - reopen
          - archive
        default: start
      from:
        # choice にしない: 有効な step 名は job の state に依存する（custom reviewer 名は動的）。
        # 検証は CLI 側が行う。
        description: "resume 時の再開 step override（通常は空 = checkpoint から自動再開）。reopen 時は必須"
        required: false
        type: string
      reason:
        description: "reopen 時の operator rationale（--reason。reopen 時は必須）"
        required: false
        type: string
      prompt:
        # workflow_dispatch input は発火に write 権限が要るため operator input として扱える。
        description: "resume 時に agent context へ注入する operator 裁定（--prompt）"
        required: false
        type: string
      force:
        description: "resume 時に 3 連続 escalation guard を override する（--force）"
        required: false
        type: boolean
        default: false
      wontfix:
        description: "resume 時に regression-gate findings を wontfix にする 1-based index（comma 区切り、--wontfix。wontfix_reason 必須）"
        required: false
        type: string
      wontfix_reason:
        description: "wontfix の理由（--wontfix-reason）"
        required: false
        type: string

concurrency:
  group: specrunner-dispatch-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # branch push
      pull-requests: write # PR 作成
      issues: write # terminal 通知コメント・Development リンク登録
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # pipeline の egress 検査 (rev-list --not --remotes) を full history で走らせる
          # checkout v4 は既定で GITHUB_TOKEN を local git config に保存する。
          # SpecRunner は agent subprocess の env から token を除去し、git fetch/push は
          # コマンド単位の transport auth で行うため、config 残留 token はその防壁の裏口になる。
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - name: Ensure Claude Code native binary
        # bun install は libc を選別せず musl variant も展開する。SDK は musl → glibc の
        # 順に解決するため、glibc runner では musl binary が選ばれ、musl loader 不在で
        # exec が ENOENT（"not found" 表示）になる。musl variant を除去して glibc へ
        # 落とし、glibc binary の実在を検査してから pipeline を走らせる。
        run: |
          rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
          test -e node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude

      - name: Git identity for pipeline commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize local main ref
        # changed-line-coverage は `git diff main...HEAD` で変更行を導出する
        # (changed-lines.ts の baseBranch 既定値は local ref の "main")。checkout は
        # dispatch ref だけを local branch 化するため main が unknown revision になり
        # 検証が fail-closed する (実測: run 32554432594 verification iter 3)。
        # origin/main から local ref を補う。main を checkout している場合は何もしない。
        run: git rev-parse --verify -q main >/dev/null || git branch main origin/main

      - name: Enable sandbox prerequisites
        # 実測（run 32379478853）: ubuntu-latest は bwrap 不在 +
        # apparmor_restrict_unprivileged_userns=1 で Claude Code の Linux sandbox が
        # 縮退し、agent が tool を実行できず turn を使い切る。両前提を有効化する。
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Runner sandbox diagnostics
        run: |
          which bwrap || echo "bwrap: absent"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true

      - name: Claude Code smoke test
        # pipeline 抜きで claude binary の単発実行が成立するかを検証する。
        # 失敗時は生 stderr が唯一の証拠（pipeline 経由では握りつぶされる）。
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bin=node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
          "$bin" --version
          timeout 120 "$bin" -p "reply with exactly: SMOKE_OK" 2>claude-stderr.txt || echo "smoke exit=$?"
          echo "--- stderr ---"; tail -c 4000 claude-stderr.txt || true

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # debug: agent session transcript を .specrunner/logs/<jobId>/ に書かせる
          SPECRUNNER_LOG_LEVEL: debug
          # SDK 側の debug log（SpecRunner の plumbing に依存しない証拠経路）
          CLAUDE_CODE_DEBUG_LOGS_DIR: ${{ github.workspace }}/.claude-debug
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          ACTION: ${{ inputs.action }}
          FROM: ${{ inputs.from }}
          REASON: ${{ inputs.reason }}
          PROMPT: ${{ inputs.prompt }}
          FORCE: ${{ inputs.force }}
          WONTFIX: ${{ inputs.wontfix }}
          WONTFIX_REASON: ${{ inputs.wontfix_reason }}
        run: |
          if [ "$ACTION" = "resume" ]; then
            set -- --from-issue "$ISSUE"
            [ -n "$FROM" ] && set -- "$@" --from "$FROM"
            [ -n "$PROMPT" ] && set -- "$@" --prompt "$PROMPT"
            [ "$FORCE" = "true" ] && set -- "$@" --force
            if [ -n "$WONTFIX" ]; then
              set -- "$@" --wontfix "$WONTFIX" --wontfix-reason "$WONTFIX_REASON"
            fi
            bun ./bin/specrunner.ts job resume "$@"
          elif [ "$ACTION" = "reopen" ]; then
            # awaiting-archive job の reopen（#1066）。from / reason は CLI 契約上も必須。
            if [ -z "$FROM" ] || [ -z "$REASON" ]; then
              echo "::error::reopen には from と reason の両方が必須"
              exit 1
            fi
            # remote runner に local state は無いため、attach で job/worktree を復元する。
            BRANCH=$(gh api graphql \
              -F owner='${{ github.repository_owner }}' \
              -F name='${{ github.event.repository.name }}' \
              -F number="$ISSUE" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){linkedBranches(first:20){nodes{ref{name}}}}}}' \
              --jq '[.data.repository.issue.linkedBranches.nodes[].ref.name] | (map(select(startswith("change/"))) + .) | first // empty')
            if [ -z "$BRANCH" ]; then
              # PR 作成後は Development link が branch から PR へ置き換わり linkedBranches が
              # 空になる (実測: run 32568457970)。reopen は常に PR 作成後なので、
              # issue の closing PR 参照 (OPEN のみ) の head branch へ fallback する。
              BRANCH=$(gh api graphql \
                -F owner='${{ github.repository_owner }}' \
                -F name='${{ github.event.repository.name }}' \
                -F number="$ISSUE" \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){closedByPullRequestsReferences(first:20,includeClosedPrs:false){nodes{headRefName}}}}}' \
                --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[].headRefName] | (map(select(startswith("change/"))) + .) | first // empty')
            fi
            if [ -z "$BRANCH" ]; then
              echo "::error::issue #$ISSUE の branch を解決できない（Development linked branch も OPEN な closing PR も無い）"
              exit 1
            fi
            bun ./bin/specrunner.ts job attach --branch "$BRANCH" | tee attach-out.txt
            SLUG=$(sed -n "s/^Attached job '\([^']*\)'.*/\1/p" attach-out.txt)
            if [ -z "$SLUG" ]; then
              echo "::error::attach 出力から slug を特定できない"
              exit 1
            fi
            bun ./bin/specrunner.ts job reopen "$SLUG" --from "$FROM" --reason "$REASON"
          elif [ "$ACTION" = "archive" ]; then
            bun ./bin/specrunner.ts job archive --from-issue "$ISSUE"
          else
            bun ./bin/specrunner.ts job start --from-issue "$ISSUE"
          fi

      - name: Dump SpecRunner logs
        # runner の log は VM と共に消えるため、失敗診断用に常時 tail を残す
        if: always()
        run: |
          for f in $(find .specrunner .git/specrunner-worktrees/*/.specrunner .claude-debug -type f \( -name "*.log" -o -name "*.jsonl" -o -name "*.txt" \) 2>/dev/null); do
            echo "===== $f ====="
            tail -c 30000 "$f"
            echo
          done
