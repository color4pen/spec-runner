name: SpecRunner Dispatch

# Actions 画面から issue 番号だけで pipeline を起動 / 再開する手動発火。
# issue 本文の取得・slug 抽出・draft 実体化・branch 特定はすべて CLI の issue-target 層が担い、
# workflow は SpecRunner の内部知識を持たない。
#
# - start:  issue 本文（request.md 形式、Meta に slug 必須）から新規 job を起動する。
#           feature branch は issue の Development linked branch として登録される。
# - resume: escalation で awaiting-resume になった job を issue 番号から再開する。
#           issue コメントの escalation marker → Development リンク → checkpoint identity 照合
#           → rebind → resume。checkpoint は feature branch に publish されているため、
#           別 runner（ephemeral 環境）からでも issue 番号だけで継続できる。
#
# 前提: リポジトリ secret CLAUDE_CODE_OAUTH_TOKEN（`claude setup-token` の出力）。

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
      action:
        description: "start: issue 本文から新規 job を起動 / resume: escalation 済み job を再開"
        type: choice
        options:
          - start
          - resume
        default: start

concurrency:
  group: specrunner-dispatch-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # branch push
      pull-requests: write # PR 作成
      issues: write # terminal 通知コメント・Development リンク登録
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # pipeline の egress 検査 (rev-list --not --remotes) を full history で走らせる

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - name: Git identity for pipeline commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "resume" ]; then
            bun ./bin/specrunner.ts job resume --from-issue "$ISSUE"
          else
            bun ./bin/specrunner.ts job start --from-issue "$ISSUE"
          fi
